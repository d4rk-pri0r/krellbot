name: Publish

# PyPI publication is undecided (decisions.md). Manual dispatch only; a v* tag must not queue a PyPI run.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  pypi:
    name: Build and publish to PyPI
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
