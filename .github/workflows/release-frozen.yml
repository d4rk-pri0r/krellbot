name: release-frozen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            platform_tag: macos
            archive_name: krellbot-macos-arm64.zip
          - os: ubuntu-latest
            arch: x86_64
            platform_tag: linux
            archive_name: krellbot-linux-x86_64.zip
          - os: windows-latest
            arch: x86_64
            platform_tag: windows
            archive_name: krellbot-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest -q tests/test_release_archive.py tests/test_frozen_main.py
        env:
          PYTHONUTF8: "1"

      - name: Build frozen one-dir binary
        run: uv run python scripts/freeze.py

      - name: Locate bundled static assets
        id: static
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="dist/krellbot"
          if [ ! -d "$BUNDLE" ]; then
            echo "::error::bundle directory missing: $BUNDLE"
            exit 1
          fi
          STATIC="$BUNDLE/krellbot/ui/static/index.html"
          if [ ! -f "$STATIC" ]; then
            echo "::error::bundled static file missing: $STATIC"
            exit 1
          fi
          echo "static=$STATIC" >> "$GITHUB_OUTPUT"

      - name: "Verify bundled static is NOT the checkout"
        # The bundled static must live under dist/, not under src/.
        # Catches the regression where PyInstaller's --add-data is
        # silently a no-op and the bundled binary reads from the checkout.
        shell: bash
        run: |
          set -euo pipefail
          STATIC="${{ steps.static.outputs.static }}"
          case "$STATIC" in
            dist/*) echo "ok: static is inside the frozen bundle ($STATIC)" ;;
            *) echo "::error::static lives outside the frozen bundle: $STATIC"; exit 1 ;;
          esac

      - name: "Smoke test packaged CLI list"
        # Invoke the built binary's `list` command in an isolated home
        # and confirm it exits 0. The list command reads the catalog and
        # prints a DSL pack summary; with no packs installed it prints
        # a friendly empty summary.
        shell: bash
        env:
          KRELLBOT_HOME: ${{ runner.temp }}/krellbot-home
          PYTHONKEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="dist/krellbot/krellbot.exe"
          else
            BIN="dist/krellbot/krellbot"
          fi
          if [ ! -x "$BIN" ] && [ ! -f "$BIN" ]; then
            echo "::error::frozen binary missing: $BIN"
            exit 1
          fi
          "$BIN" list
          # `list` exits 0 whether or not packs exist; we just confirm
          # the bundled binary can launch its CLI loop.

      - name: Build immutable archive and manifest
        shell: bash
        env:
          KRELLBOT_VERSION: "0.9.1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ARCHIVE="artifacts/${{ matrix.archive_name }}"
          URL="https://example.com/releases/${KRELLBOT_VERSION}/${{ matrix.archive_name }}"
          uv run python -c "
          import json
          from pathlib import Path
          from scripts.release_archive import build_archive
          m = build_archive(
              Path('dist/krellbot'),
              Path('$ARCHIVE'),
              version='${KRELLBOT_VERSION}',
              platform_tag='${{ matrix.platform_tag }}',
              arch='${{ matrix.arch }}',
              url='${URL}',
          )
          print(json.dumps(m, indent=2, sort_keys=True))
          " | tee artifacts/manifest-${{ matrix.platform_tag }}-${{ matrix.arch }}.json

      - name: Upload archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: krellbot-${{ matrix.platform_tag }}-${{ matrix.arch }}
          path: |
            artifacts/${{ matrix.archive_name }}
            artifacts/manifest-${{ matrix.platform_tag }}-${{ matrix.arch }}.json
          if-no-files-found: error
