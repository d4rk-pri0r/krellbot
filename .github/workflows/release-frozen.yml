name: release-frozen

on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: "Request macOS Developer ID + notarization and Windows Authenticode (requires secrets). Leave false for unsigned smoke."
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/release-frozen.yml"
      - "docs/signing.md"
      - "scripts/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/test_release_archive.py"
      - "tests/test_frozen_main.py"
      - "tests/test_ci_smoke_frozen_paper.py"
      - "tests/test_release_signing_gates.py"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-frozen-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            platform_tag: macos
            archive_name: krellbot-macos-arm64.zip
          - os: ubuntu-latest
            arch: x86_64
            platform_tag: linux
            archive_name: krellbot-linux-x86_64.zip
          - os: windows-latest
            arch: x86_64
            platform_tag: windows
            archive_name: krellbot-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
      KRELLBOT_VERSION: "0.9.7"
      # Pass the immutable release base URL through from the repo
      # variable explicitly so the fail-closed verification step
      # always has the variable available. If the repo variable is
      # not configured, ``vars.KRELLBOT_RELEASE_BASE_URL`` expands
      # to the empty string and the downstream
      # ``Verify immutable release base URL is configured`` step
      # fails the run closed with a clear error message — release
      # automation must pin the CDN per matrix.
      KRELLBOT_RELEASE_BASE_URL: ${{ vars.KRELLBOT_RELEASE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # Pin Node 22 with actions/setup-node@v4 before the freeze step.
      # The Vite build needs the dev toolchain (vite, @vitejs/plugin-react,
      # typescript, vitest) on PATH. ``npm ci`` alone is NOT enough: the
      # github-hosted runners export ``NODE_ENV=production`` by default and
      # ``npm ci`` then skips ``devDependencies``. ``npm ci --include=dev``
      # overrides that default. We run the build BEFORE the freeze step so
      # ``frontend/dist/index.html`` exists when PyInstaller is invoked —
      # ``scripts/freeze.freeze()`` refuses to start PyInstaller when the
      # built index is missing.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend toolchain (devDependencies included)
        # Plain ``npm ci`` is wrong on hosts that export NODE_ENV=production
        # (which most CI runners do); --include=dev overrides that skip.
        run: npm ci --include=dev --prefix frontend

      - name: Build the paper shell
        # Produces ``frontend/dist/index.html``. ``scripts/freeze.freeze()``
        # refuses to invoke PyInstaller when this file is missing; if you
        # skip this step the release freezes closed with a clear error.
        run: npm --prefix frontend run build

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest -q tests/test_release_archive.py tests/test_frozen_main.py tests/test_ci_smoke_frozen_paper.py
        env:
          PYTHONUTF8: "1"

      - name: Build frozen one-dir binary
        run: uv run python scripts/freeze.py

      - name: Locate bundled static assets
        id: static
        shell: bash
        run: |
          set -euo pipefail
          # PyInstaller 6.x puts the Python runtime + data files under
          # `_internal/` inside the bundle. The launcher executable is
          # `dist/krellbot/krellbot` (POSIX) or `dist/krellbot/krellbot.exe`
          # (Windows); the bundled static directory lives at
          # `dist/krellbot/_internal/frontend/dist/` (the built
          # workstation shell). We accept both the PyInstaller 6.x layout
          # and the legacy root layout.
          CANDIDATES=(
            "dist/krellbot/_internal/frontend/dist/index.html"
            "dist/krellbot/frontend/dist/index.html"
          )
          STATIC=""
          for cand in "${CANDIDATES[@]}"; do
            if [ -f "$cand" ]; then
              STATIC="$cand"
              break
            fi
          done
          if [ -z "$STATIC" ]; then
            echo "::error::bundled static file missing under any known layout (tried: ${CANDIDATES[*]})"
            exit 1
          fi
          echo "static=$STATIC" >> "$GITHUB_OUTPUT"

      - name: "Verify bundled static is NOT the checkout"
        # The bundled static must live under dist/, not under src/.
        # Catches the regression where PyInstaller's --add-data is
        # silently a no-op and the bundled binary reads from the checkout.
        shell: bash
        run: |
          set -euo pipefail
          STATIC="${{ steps.static.outputs.static }}"
          case "$STATIC" in
            dist/*) echo "ok: static is inside the frozen bundle ($STATIC)" ;;
            *) echo "::error::static lives outside the frozen bundle: $STATIC"; exit 1 ;;
          esac

      - name: "Smoke test packaged CLI list"
        # Invoke the built binary's `list` command in an isolated home
        # and confirm it exits 0. The list command reads the catalog and
        # prints a DSL pack summary; with no packs installed it prints
        # a friendly empty summary.
        shell: bash
        env:
          KRELLBOT_HOME: ${{ runner.temp }}/krellbot-home
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="dist/krellbot/krellbot.exe"
          else
            BIN="dist/krellbot/krellbot"
          fi
          if [ ! -x "$BIN" ] && [ ! -f "$BIN" ]; then
            echo "::error::frozen binary missing: $BIN"
            exit 1
          fi
          "$BIN" list
          # `list` exits 0 whether or not packs exist; we just confirm
          # the bundled binary can launch its CLI loop.

      - name: "Smoke test bundled workstation shell"
        # INT06 — smoke the workstation launcher. The frozen binary's
        # ``workstation`` subcommand binds the FastAPI shell to a
        # loopback socket and prints the URL with no token; the
        # helper parses the URL, GETs ``/`` with the loopback
        # ``Host`` header, and accepts either a 200 with
        # ``krellbot-bootstrap`` (built dist) or a 404 with
        # ``shell_not_built`` (no dist). This step runs on every
        # matrix entry, proving the workstation shell is bundled.
        # The CLI prints the URL with ``flush=True`` so the
        # helper captures it from a real ``subprocess.PIPE`` on
        # every platform — no tty, no winpty, no third-party
        # dependency. Cleanup: ``scripts/ci_smoke_workstation.py``
        # owns the spawned child via its own ``finally:`` block
        # (``CTRL_BREAK_EVENT`` on Windows / ``SIGINT`` on POSIX,
        # plus a ``kill()`` fallback), so we do NOT install a
        # bash ``trap`` here — the helper is the single source of
        # truth for child cleanup on every platform. A
        # workflow-side ``pkill`` trap would fail-closed on
        # Windows Git Bash runners, which ship without the GNU
        # ``procps`` tools. See
        # ``tests/test_ci_smoke_workstation.py::test_workflow_workstation_smoke_step_*``.
        shell: bash
        env:
          KRELLBOT_HOME: ${{ runner.temp }}/krellbot-home
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="dist/krellbot/krellbot.exe"
          else
            BIN="dist/krellbot/krellbot"
          fi
          uv run python scripts/ci_smoke_workstation.py \
            --binary "$BIN" \
            --port 0 \
            --home "${{ runner.temp }}/krellbot-home" \
            --log workstation_smoke.log

      - name: "Frozen paper first-use smoke (native)"
        # The release gate that the v0.9.4/v0.9.5 workflows lacked. It
        # executes the actual PyInstaller one-dir bundle after copying it
        # outside the checkout, with a fresh isolated home and a stripped
        # credential/PYTHONPATH environment. The helper proves the frozen
        # runtime can validate a supplied example pack (bundled
        # krellbot/pack/schema.json), paper-arm it, report status, disarm,
        # serve the *built* workstation shell (404 shell_not_built fails),
        # and hard-refuse a live arm with KRELLBOT_ENABLE_LIVE=1 as
        # paper-only. A missing bundled pack/schema.json fails phase 1 at
        # runtime, not by inspecting an inventory. Publish depends on this
        # build matrix, so a failure here blocks the release.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="dist/krellbot/krellbot.exe"
          else
            BIN="dist/krellbot/krellbot"
          fi
          # Bash on Windows is Git Bash; Python/uv are already on PATH.
          # The helper copies the bundle into the workdir, so the runtime
          # executes from outside the checkout. It sets its own isolated
          # KRELLBOT_HOME / HOME / keyring backend and never reads CI
          # credentials even if the runner happens to export them.
          uv run python scripts/ci_smoke_frozen_paper.py \
            --binary "$BIN" \
            --home "${{ runner.temp }}/krellbot-frozen-paper-home" \
            --workdir "${{ runner.temp }}/krellbot-frozen-paper-work" \
            --pack docs/example-pack.json

      - name: "Preserve frozen paper first-use evidence"
        # Always upload the helper's log and staged runtime diagnostics,
        # including the failing platform. Release evidence must survive a
        # failed smoke so the missing resource/refusal can be diagnosed
        # without re-running a native build.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-paper-smoke-${{ matrix.platform_tag }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/krellbot-frozen-paper-work/frozen-paper-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Chromium for native Windows installed-app qualification
        if: matrix.os == 'windows-latest'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Native Windows install, reinstall, no-argument launch and Signal navigation
        if: matrix.os == 'windows-latest'
        env:
          KRELLBOT_ENABLE_LIVE: "0"
          KRELLBOT_LIVE: "0"
        run: node scripts/ci_smoke_installed_preview.mjs dist/krellbot "${{ runner.temp }}/installed-preview-evidence"

      - name: Preserve native Windows installed-app evidence
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-preview-evidence
          path: ${{ runner.temp }}/installed-preview-evidence/
          if-no-files-found: ignore
          retention-days: 7

      # ------------------------------------------------------------------
      # Platform signing (secrets-gated). PR CI always stays unsigned.
      # Tag / workflow_dispatch builds sign only when signing is requested
      # via vars.KRELLBOT_SIGN_RELEASE=true or the dispatch input
      # sign_release=true. When requested, missing secrets fail closed.
      # Secret *names* are documented in docs/signing.md — never commit
      # cert material.
      # ------------------------------------------------------------------
      - name: Resolve whether platform signing is requested
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        env:
          DISPATCH_SIGN: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release || false }}
          VAR_SIGN: ${{ vars.KRELLBOT_SIGN_RELEASE }}
        run: |
          set -euo pipefail
          requested=false
          if [ "${DISPATCH_SIGN}" = "true" ]; then
            requested=true
          elif [ "${VAR_SIGN}" = "true" ] || [ "${VAR_SIGN}" = "1" ]; then
            requested=true
          fi
          echo "requested=${requested}" >> "$GITHUB_OUTPUT"
          if [ "${requested}" = "true" ]; then
            echo "Platform signing requested for this non-PR run."
          else
            echo "Platform signing not requested; producing unsigned checksum-pinned artifacts."
            echo "Set repo variable KRELLBOT_SIGN_RELEASE=true (or dispatch with sign_release=true) after secrets are configured."
          fi

      - name: Sign macOS Developer ID Application and notarize
        if: >-
          matrix.os == 'macos-latest'
          && github.event_name != 'pull_request'
          && steps.signing.outputs.requested == 'true'
        id: macos_sign
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_CODESIGN_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_API_KEY_P8_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::macOS signing requested but required secrets are missing: ${missing[*]}"
            echo "Configure the secret names listed in docs/signing.md, then re-run."
            exit 1
          fi

          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="${RUNNER_TEMP}/krellbot-signing.keychain-db"
          P12_PATH="${RUNNER_TEMP}/developer-id.p12"
          P8_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          NOTARIZE_ZIP="${RUNNER_TEMP}/krellbot-macos-notarize.zip"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | sed -e s/\"//g)

          echo "${APPLE_DEVELOPER_ID_P12_BASE64}" | base64 --decode > "${P12_PATH}"
          security import "${P12_PATH}" -k "${KEYCHAIN_PATH}" -P "${APPLE_DEVELOPER_ID_P12_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          rm -f "${P12_PATH}"

          # Sign nested Mach-O / dylib / so / bundle binaries deepest-first, then the launcher.
          while IFS= read -r -d '' candidate; do
            if file "${candidate}" | grep -Eq 'Mach-O|shared library|dynamically linked shared library|bundle'; then
              echo "codesign: ${candidate}"
              codesign --force --options runtime --timestamp \
                --sign "${APPLE_CODESIGN_IDENTITY}" "${candidate}"
            fi
          done < <(find dist/krellbot -type f -print0 | sort -z -r)
          codesign --force --options runtime --timestamp \
            --sign "${APPLE_CODESIGN_IDENTITY}" "dist/krellbot/krellbot"
          codesign --verify --deep --strict "dist/krellbot/krellbot"

          echo "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${P8_PATH}"
          ditto -c -k --keepParent "dist/krellbot" "${NOTARIZE_ZIP}"
          xcrun notarytool submit "${NOTARIZE_ZIP}" \
            --key "${P8_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait
          rm -f "${P8_PATH}" "${NOTARIZE_ZIP}"

          # Zip-distributed onedir: stapling applies to .app/.pkg/.dmg, not bare zips.
          # Gatekeeper validates the notarization ticket online for these hashes.
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "macos Developer ID + notarization completed"

      - name: Sign Windows Authenticode
        if: >-
          matrix.os == 'windows-latest'
          && github.event_name != 'pull_request'
          && steps.signing.outputs.requested == 'true'
        id: windows_sign
        env:
          WINDOWS_CODESIGN_P12_BASE64: ${{ secrets.WINDOWS_CODESIGN_P12_BASE64 }}
          WINDOWS_CODESIGN_P12_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_P12_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_P12_BASE64)) { $missing += "WINDOWS_CODESIGN_P12_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_P12_PASSWORD)) { $missing += "WINDOWS_CODESIGN_P12_PASSWORD" }
          if ($missing.Count -gt 0) {
            Write-Error "Windows signing requested but required secrets are missing: $($missing -join ', '). See docs/signing.md."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "krellbot-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_P12_BASE64))
          $timestamp = $env:WINDOWS_CODESIGN_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestamp)) {
            $timestamp = "http://timestamp.digicert.com"
          }

          $candidates = @(
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName
          )
          if (-not $candidates -or $candidates.Count -eq 0) {
            Write-Error "signtool.exe not found on the Windows runner"
          }
          $signtool = $candidates[0]
          Write-Host "Using signtool: $signtool"

          $targets = Get-ChildItem -Path "dist\krellbot" -Recurse -Include *.exe,*.dll
          foreach ($target in $targets) {
            Write-Host "signtool: $($target.FullName)"
            & $signtool sign /f $pfxPath /p $env:WINDOWS_CODESIGN_P12_PASSWORD `
              /fd SHA256 /td SHA256 /tr $timestamp $target.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "signtool failed for $($target.FullName)"
            }
          }
          Remove-Item -Force $pfxPath
          Add-Content -Path $env:GITHUB_OUTPUT -Value "signed=true"
          Write-Host "windows Authenticode signing completed"

      - name: Record Linux checksum-pinned signing policy
        if: >-
          matrix.os == 'ubuntu-latest'
          && github.event_name != 'pull_request'
        id: linux_sign
        shell: bash
        run: |
          set -euo pipefail
          # Linux has no Gatekeeper/Authenticode equivalent in this product.
          # Integrity remains HTTPS-pinned SHA-256 (see docs/signing.md).
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "policy=checksum_pinned" >> "$GITHUB_OUTPUT"
          echo "Linux release artifacts stay checksum-pinned (no platform code signature)."

      - name: Write signing status marker
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_REQUESTED: ${{ steps.signing.outputs.requested }}
          MACOS_SIGNED: ${{ steps.macos_sign.outputs.signed }}
          WINDOWS_SIGNED: ${{ steps.windows_sign.outputs.signed }}
          LINUX_POLICY: ${{ steps.linux_sign.outputs.policy }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          platform="${{ matrix.platform_tag }}"
          arch="${{ matrix.arch }}"
          signed="false"
          detail="unsigned"
          if [ "${SIGNING_REQUESTED}" != "true" ]; then
            detail="unsigned_signing_not_requested"
          elif [ "${platform}" = "macos" ] && [ "${MACOS_SIGNED}" = "true" ]; then
            signed="true"
            detail="developer_id_notarized"
          elif [ "${platform}" = "windows" ] && [ "${WINDOWS_SIGNED}" = "true" ]; then
            signed="true"
            detail="authenticode"
          elif [ "${platform}" = "linux" ]; then
            detail="checksum_pinned_policy"
          fi
          cat > "artifacts/signing-status-${platform}-${arch}.json" <<EOF
          {
            "platform": "${platform}",
            "arch": "${arch}",
            "signing_requested": ${SIGNING_REQUESTED:-false},
            "signed": ${signed},
            "detail": "${detail}",
            "sha": "${GITHUB_SHA}"
          }
          EOF
          # Normalize JSON whitespace for humans reading the artifact.
          uv run python -c "import json,pathlib; p=pathlib.Path('artifacts/signing-status-${platform}-${arch}.json'); p.write_text(json.dumps(json.loads(p.read_text()), indent=2, sort_keys=True)+'\n')"

      - name: "Verify immutable release base URL is configured"
        if: github.event_name != 'pull_request'
        # The manifest URL is built from $KRELLBOT_RELEASE_BASE_URL +
        # version + archive_name. CI fails closed if the base URL is
        # missing or doesn't end with a slash; release automation must
        # pin the immutable release CDN (or equivalent) per matrix.
        id: release_base
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KRELLBOT_RELEASE_BASE_URL:-}" ]; then
            echo "::error::KRELLBOT_RELEASE_BASE_URL is not set; refusing to emit manifest"
            echo "hint: configure the immutable release base URL (e.g. https://releases.example.com/krellbot) in the workflow env or repo settings"
            exit 1
          fi
          # Must be http(s) and end with a slash so we can append
          # `<version>/<archive_name>` deterministically.
          case "$KRELLBOT_RELEASE_BASE_URL" in
            http://*/|https://*/) ;;
            *) echo "::error::KRELLBOT_RELEASE_BASE_URL must be http(s) and end with a slash: $KRELLBOT_RELEASE_BASE_URL"; exit 1 ;;
          esac
          echo "release_base=$KRELLBOT_RELEASE_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Build immutable archive and manifest
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KRELLBOT_VERSION: ${{ env.KRELLBOT_VERSION }}
          KRELLBOT_RELEASE_BASE_URL: ${{ steps.release_base.outputs.release_base }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ARCHIVE="artifacts/${{ matrix.archive_name }}"
          # A v* tag publishes to GitHub Releases. The download path is
          # {base}{tag}/{archive}, so the manifest version is the tag,
          # not the package version string.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            KRELLBOT_VERSION="${GITHUB_REF_NAME}"
          fi
          URL="${KRELLBOT_RELEASE_BASE_URL}${KRELLBOT_VERSION}/${{ matrix.archive_name }}"
          uv run python -c "
          import json
          from pathlib import Path
          from scripts.release_archive import build_archive
          m = build_archive(
              Path('dist/krellbot'),
              Path('${ARCHIVE}'),
              version='${KRELLBOT_VERSION}',
              platform_tag='${{ matrix.platform_tag }}',
              arch='${{ matrix.arch }}',
              url='${URL}',
          )
          print(json.dumps(m, indent=2, sort_keys=True))
          " | tee "artifacts/manifest-${{ matrix.platform_tag }}-${{ matrix.arch }}.json"

      - name: Upload archive and manifest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: krellbot-${{ matrix.platform_tag }}-${{ matrix.arch }}
          path: |
            artifacts/${{ matrix.archive_name }}
            artifacts/manifest-${{ matrix.platform_tag }}-${{ matrix.arch }}.json
            artifacts/signing-status-${{ matrix.platform_tag }}-${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    name: publish GitHub release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: krellbot-*
          merge-multiple: true
      - name: Upload zips to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t zips < <(find release-assets -type f -name '*.zip' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::no release zips downloaded"
            exit 1
          fi

          # Honest release notes from signing-status markers. Never claim
          # notarized / Authenticode unless the platform markers say so.
          # Channel stays --prerelease until owner flips ARTIFACTS_SIGNED
          # (M12.2 / M13.3) — this job does not promote to GA.
          # Fallback keeps the historical Unsigned / Not notarized phrasing
          # when the helper or markers are absent.
          if [ -f scripts/ci_release_notes_from_signing_status.py ]; then
            NOTES="$(python3 scripts/ci_release_notes_from_signing_status.py --root release-assets --sha "${GITHUB_SHA}")"
          else
            NOTES="Unsigned checksum-pinned build from ${GITHUB_SHA}. Not notarized. Not Authenticode-signed. SHA-256 is the integrity check."
          fi

          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --prerelease \
              --notes "${NOTES}"
          fi
          gh release upload "${GITHUB_REF_NAME}" "${zips[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
