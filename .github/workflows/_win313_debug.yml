name: _win313_debug
# TEMPORARY DEBUG WORKFLOW — created by M3-REPAIR-RESTORE-R2 worker session
# to reproduce the windows-latest + python-3.13 test_restore_roundtrip_script_runs_and_passes
# failure on this host (which lacks QEMU/Wine). This workflow runs only the harness
# (scripts/restore_roundtrip.py) so the failure pattern surfaces without spending the
# full CI matrix budget. Delete this file before any leaf commit.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync project venv (frozen)
        run: uv sync --frozen
      - name: Run restore_roundtrip.py (Windows + Py3.13 reproducer)
        env:
          KRELLBOT_ENABLE_LIVE: "0"
          PYTHON_KEYRING_BACKEND: tests.fakes.fake_keyring.FakeKeyring
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $home = Join-Path $env:TEMP ("steward-home-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $home -Force | Out-Null
          $env:KRELLBOT_HOME = $home
          $env:HOME = $home
          $env:USERPROFILE = $home
          uv run python scripts/restore_roundtrip.py 2>&1
          $rc = $LASTEXITCODE
          Write-Output ("harness_rc=" + $rc)
