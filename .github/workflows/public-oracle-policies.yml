              (trusted / 'invariants-allowlist.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, value in (('trusted', str(trusted)), ('base', base), ('head', head), ('pr', number or ''), ('source', source)):
                  output.write(f'{name}={value}\n')
          print(json.dumps({'target_pr': number or None, 'base': base, 'head': head, 'policy_source': source}))
          PY
        id: target
      - name: Run trusted test-integrity against candidate Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED: ${{ steps.target.outputs.trusted }}
          TARGET_BASE: ${{ steps.target.outputs.base }}
          TARGET_HEAD: ${{ steps.target.outputs.head }}
          TARGET_PR: ${{ steps.target.outputs.pr }}
        run: |
          cd "$TRUSTED"
          python3 -I -c 'import runpy,sys; sys.path.insert(0,sys.argv.pop(1)); runpy.run_module("scripts.test_integrity",run_name="__main__")' "$TRUSTED" --workdir "$GITHUB_WORKSPACE" --base "$TARGET_BASE" --head "$TARGET_HEAD" --repo "$GITHUB_REPOSITORY" --pr "$TARGET_PR" --json "$RUNNER_TEMP/test-integrity-result.json"
      - name: Preserve test-integrity audit result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
