          base_script = f'origin/main:.github/scripts/{module}.py'
          present = subprocess.run(['git', 'cat-file', '-e', base_script], capture_output=True).returncode == 0
          source = 'origin/main' if present else os.environ['GITHUB_SHA']
          if not present:
              print(f'BOOTSTRAP: base branch lacks {module}.py; using the reviewed CI candidate copy at {source}. Not yet an enforced trusted-base gate.')
              call('git', 'fetch', '--no-tags', 'origin', source)
          else:
              print(f'TRUSTED BASE: git show {base_script}; candidate scripts and allowlist will not execute')
          trusted = pathlib.Path(os.environ['RUNNER_TEMP']) / ('policy-' + module)
