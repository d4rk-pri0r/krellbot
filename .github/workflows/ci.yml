name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        # Verbose per-test progress plus a stack dump if any test stalls.
        # The macOS 3.13 runner has hung in earlier PR runs while other
        # matrix entries finished; keep the test failure diagnosable.
        run: uv run --python ${{ matrix.python }} pytest -vv -o faulthandler_timeout=120
        env:
          COLUMNS: "100"
          PYTHONUTF8: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests
